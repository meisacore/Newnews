<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORX — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

<style>
  /* FONTS — change these two lines to restyle all the text on the page.
     (If you pick a different Google font, also update the <link> above.) */
  :root {
    --font-title: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; /* BOAX */
    --font-text:  'Cormorant Garamond', Georgia, 'Times New Roman', serif; /* everything else */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: #02101b;
    color: white;
    font-family: var(--font-text);
    overflow: hidden;
  }

  .scene {
    position: relative;
    min-height: 100svh;
    display: grid;
    place-items: center;
    isolation: isolate;
    background: #03131f;
  }

  /* The animated sky is drawn on this canvas by the script at the bottom. */
  #sky {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -3;
    display: block;
    background: #03131f;
  }

  /* Soft dark glow behind the text so it stays readable. */
  .shade {
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(1,12,24,.43), transparent 52%),
      linear-gradient(to bottom, rgba(0,7,17,.24), transparent 50%, rgba(0,6,16,.34));
  }

  .content {
    text-align: center;
    padding: 28px;
    transform: translateY(-4vh);
    animation: appear 1.4s ease-out backwards;
  }

  .welcome {
    font-family: var(--font-text);
    font-style: italic;
    font-size: clamp(30px, 4vw, 52px);
    line-height: 1;
    margin: 0 0 10px;
    color: #e9f5ff;
    font-weight: 400;
    letter-spacing: .04em;
    text-shadow: 0 2px 18px #00121c;
  }

  .brand {
    font-family: var(--font-title);
    font-size: clamp(56px, 9vw, 118px);
    font-weight: 600;
    letter-spacing: .18em;
    margin: 0 0 6px .18em;
    line-height: 1.1;
    text-shadow: 0 5px 35px rgba(0,0,0,.32);
  }

  .tagline {
    font-family: var(--font-text);
    font-style: italic;
    font-size: clamp(24px, 3.2vw, 40px);
    line-height: 1.25;
    font-weight: 400;
    letter-spacing: .03em;
    margin: 6px 0 38px;
    color: #f1f6ff;
    text-shadow: 0 3px 18px #00111c;
  }

  .enter {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(3,17,30,.25);
    color: #fff;
    padding: 16px 29px;
    font-family: var(--font-text);
    letter-spacing: .26em;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: background .2s, transform .2s;
  }
  .enter:hover, .enter:focus-visible {
    background: rgba(255,255,255,.17);
    transform: translateY(-2px);
  }

  .note {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-text);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .22em;
    color: #d4e4eea6;
  }

  .brand span { color: #c9b48c; text-shadow: 0 0 40px rgba(201,180,140,.28), 0 5px 35px rgba(0,0,0,.32); }

  /* ENTER sequence: "Welcome to" dissolves first, then the tagline and button,
     then NORX itself drifts apart and fades as the camera flies in. */
  .welcome, .tagline, .enter, .note, .brand {
    transition: opacity .8s ease, transform 1.2s ease, filter .9s ease, letter-spacing 2s ease;
  }
  body.warp .welcome { opacity: 0; transform: translateY(-10px); filter: blur(5px); }
  body.warp .tagline { opacity: 0; transform: translateY(8px); filter: blur(4px); transition-delay: .25s; }
  body.warp .enter   { opacity: 0; transform: translateY(8px); pointer-events: none; transition-delay: .15s; }
  body.warp .note    { opacity: 0; }
  body.warp .brand   { opacity: 0; transform: scale(1.1); letter-spacing: .27em; filter: blur(3px);
                       transition: opacity 1s ease 1s, transform 2.2s ease .4s, letter-spacing 2.2s ease .4s, filter 1s ease 1s; }

  @keyframes appear {
    from { opacity: 0; transform: translateY(calc(-4vh + 24px)); }
    to   { opacity: 1; transform: translateY(-4vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    .content { animation: none; }
  }

  @media (max-width: 600px) {
    .brand { letter-spacing: .11em; margin-left: .11em; }
    .tagline { margin-bottom: 28px; }
  }
</style>
</head>

<body>
<main class="scene">
  <canvas id="sky" aria-hidden="true"></canvas>

  </section>

  <div class="note">A SIMULATED TRADING EXPERIENCE</div>

  /* ============================================================
     THE EFFECT — you shouldn't need to edit below this line
     ============================================================ */
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CRUISE = 1 / CRUISE_SECONDS;      // progress per second

  const photo = new Image();
  let W, H, scale, imgW, imgH;            // screen and photo sizes
  let progress = 0;                       // how far along the flight we are
  let speed = CRUISE, targetSpeed = CRUISE;
  let lastTime = performance.now();

  // Give each star its own random twinkle timing.
  const stars = STAR_DATA.map(([u, v, size, tint]) => ({
    u, v, size, tint,
    twinkles: Math.random() < TWINKLE_SHARE,
    offset: Math.random() * 6.283,        // so stars don't pulse in sync
    pace: 0.8 + Math.random() * 2.6       // how fast this star pulses
  }));

  // Pre-draw one soft glowing dot per colour (white, bluish, warm).
  const TINTS = [[255,255,255], [190,215,255], [255,230,210]];
  const glows = TINTS.map(rgb => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    const grad = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0,   `rgba(${rgb},1)`);
    grad.addColorStop(0.12,`rgba(${rgb},.75)`);
    grad.addColorStop(0.35,`rgba(${rgb},.16)`);
    grad.addColorStop(1,   `rgba(${rgb},0)`);
    x.fillStyle = grad;
    x.fillRect(0, 0, 64, 64);
    return c;
  });

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (imgW) scale = Math.max(W / imgW, H / imgH);   // fill the screen, like "cover"
  }

  let entering = false, enterStart = 0;

  // Twinkling glows on top of the photo's real stars.
  function drawStars(k, left, top, seconds, intensity = 1) {
    for (const s of stars) {
      const x = left + s.u * imgW * k;
      const y = top + s.v * imgH * k;
      if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
      const wave = s.twinkles
        ? Math.pow(0.5 + 0.5 * Math.sin(seconds * s.pace + s.offset), 1.6)
        : 0.45;
      const brightness = (1 - TWINKLE_DEPTH) + TWINKLE_DEPTH * wave;
      ctx.globalAlpha = Math.min(1, brightness * 0.75 * intensity);
      const r = s.size * (0.8 + 0.35 * k / scale) * Math.max(0.6, scale) * 4 * GLOW_SIZE;
      ctx.drawImage(glows[s.tint], x-r, y-r, r*2, r*2);
    }
    ctx.globalAlpha = 1;
  }

  // Draw one copy of the photo at flight position p (0 to 1).
  // The photo only ever grows (p goes up), so you always move FORWARD.
  function drawLayer(p, opacity, warp, seconds, intensity) {
    const k = scale * Math.pow(ZOOM, p) * warp;
    const left = W / 2 - imgW * k / 2;
    const top  = H * CENTER_Y - imgH * k / 2;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = opacity;
    ctx.drawImage(photo, left, top, imgW * k, imgH * k);
    ctx.globalCompositeOperation = 'screen';
    drawStars(k, left, top, seconds, intensity * opacity);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  const FADE = 0.25;   // how much of each pass is spent blending the next one in

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    speed += (targetSpeed - speed) * Math.min(1, dt * (entering ? 5 : 2.2));
    progress += dt * speed;

    const elapsed = entering ? Math.min(1, (now - enterStart) / ENTER_DELAY_MS) : 0;
    const warpZoom = entering ? Math.pow(5.2, elapsed * elapsed * (3 - 2 * elapsed)) : 1;
    const intensity = entering ? 1 + elapsed * 1.3 : 1;
    const seconds = now / 1000;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#03131f';
    ctx.fillRect(0, 0, W, H);

    // Two copies of the photo, half a pass apart. The one further along sits at
    // the back, fully visible. The other starts small, fades in over it, and
    // takes over. The screen never goes dim and the motion never reverses.
    const pa = progress % 1, pb = (progress + 0.5) % 1;
    const older   = pa >= 0.5 ? pa : pb;
    const younger = pa >= 0.5 ? pb : pa;
    const t = Math.min(1, younger / FADE);
    drawLayer(older, 1, warpZoom, seconds, intensity);
    drawLayer(younger, t * t * (3 - 2 * t), warpZoom, seconds, intensity);

    // Brief cinematic fade at the end so navigation doesn't flash abruptly.
    if (entering && elapsed > 0.82) {
      ctx.fillStyle = `rgba(2,8,19,${(elapsed - 0.82) / 0.18})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (!reduceMotion) requestAnimationFrame(frame);
  }

  photo.onload = () => {
    imgW = photo.naturalWidth; imgH = photo.naturalHeight;
    resize();
    addEventListener('resize', () => { resize(); if (reduceMotion) frame(performance.now()); });
    if (reduceMotion) { progress = 0.25; frame(performance.now()); }  // still image only
    else requestAnimationFrame(frame);
  };
  photo.onerror = () => console.warn('Could not load ' + IMAGE_FILE + ' — is it in the same folder as index.html?');
  photo.src = IMAGE_FILE;

  /* ---- ENTER WORLD button: speed up on hover, jump on click ---- */
  if (reduceMotion) return;
  const button = document.querySelector('.enter');
  const faster = () => targetSpeed = CRUISE * HOVER_SPEEDUP;
  const normal = () => targetSpeed = CRUISE;
  button.addEventListener('mouseenter', faster);
  button.addEventListener('focus', faster);
  button.addEventListener('mouseleave', normal);
  button.addEventListener('blur', normal);
  button.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;   // let ctrl/cmd-click open a new tab
    e.preventDefault();
    if (entering) return;
    entering = true;
    enterStart = performance.now();
    targetSpeed = CRUISE * CLICK_SPEEDUP;
    document.body.classList.add('warp');
    try { sessionStorage.setItem('norxArrive', '1'); } catch (_) {}
    setTimeout(() => location.href = button.href, ENTER_DELAY_MS);
  });

})();
</script>
</body>
</html>
